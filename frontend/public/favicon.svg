<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>HubWorld</title>
  <defs>
    <linearGradient id="hw" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f8cff"/>
      <stop offset="1" stop-color="#7a5cff"/>
    </linearGradient>
  </defs>
  <!-- Back half of the orbit, then the diamond, then the front half — so the
       ring passes behind and in front, which is what reads as depth. Order is
       the whole trick; flatten it and the mark loses its dimensionality. -->
  <g transform="rotate(-18 50 50)">
    <ellipse cx="50" cy="50" rx="46" ry="23" fill="none" stroke="url(#hw)" stroke-width="5.5"/>
    <circle cx="11" cy="37.8" r="7" fill="#ffffff" stroke="#1e40af" stroke-width="2"/>
  </g>
  <rect x="32" y="32" width="36" height="36" rx="9" transform="rotate(45 50 50)" fill="url(#hw)"/>
  <g transform="rotate(-18 50 50)">
    <path d="M4,50 A46,23 0 0 0 96,50" fill="none" stroke="url(#hw)" stroke-width="5.5"/>
    <circle cx="87.7" cy="63.2" r="8" fill="#ffffff" stroke="#1e40af" stroke-width="2"/>
  </g>
</svg>
