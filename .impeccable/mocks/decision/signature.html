<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
html,body{width:1440px;height:900px;overflow:hidden}
body{background:#0e0e12;color:#f2f2f5;font:400 16px/1.5 Geist,system-ui,sans-serif}
nav{height:64px;border-bottom:1px solid rgba(255,255,255,.08);display:flex;align-items:center;padding:0 160px;gap:32px}
nav b{font-weight:600}nav span{color:#9b9aa7;font-size:14px;font-weight:500}nav .r{margin-left:auto}
.wrap{display:grid;grid-template-columns:440px 1fr;gap:80px;padding:84px 160px 0}
h1{font-size:60px;line-height:1.02;letter-spacing:-.035em;font-weight:600;text-wrap:balance}
.figs{margin-top:36px;display:grid;grid-template-columns:repeat(3,1fr);gap:20px;border-top:1px solid rgba(255,255,255,.08);padding-top:22px}
.figs div b{display:block;font:500 28px Geist Mono,monospace;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.figs div span{color:#9b9aa7;font-size:13px}
.cta{margin-top:36px;display:flex;gap:20px;align-items:center}
.btn{background:#8b7cff;color:#0b0b0f;height:44px;padding:0 22px;border-radius:99px;font-weight:500;font-size:15px;display:flex;align-items:center}
.cta a{color:#9b9aa7;font-size:15px}
.field{position:relative;height:620px;margin-top:-4px}
.dots{position:absolute;inset:0;background-image:radial-gradient(circle,#4b4a58 2.2px,transparent 2.6px);background-size:24px 24.8px;background-position:12px 12px;-webkit-mask-image:linear-gradient(#000,#000)}
.lit{position:absolute;left:0;top:0;width:24px;height:24px;display:flex;align-items:center;justify-content:center}
.lit i{width:12px;height:12px;border-radius:50%;background:#8b7cff;box-shadow:0 0 0 6px rgba(139,124,255,.25)}
.cap{position:absolute;left:44px;top:2px;font-size:13px;color:#f2f2f5;background:#0e0e12;padding:0 8px}
.foot{position:absolute;right:0;bottom:-32px;font-size:12px;color:#9b9aa7}
</style></head><body>
<nav><b>HubWorld</b><span>Events</span><span class="r">not signed in</span></nav>
<div class="wrap">
<div>
<h1>One signature. A thousand tickets.</h1>
<div class="figs"><div><b>1</b><span>organizer signature</span></div><div><b>1,000</b><span>tickets minted</span></div><div><b>736 s</b><span>start to finish</span></div></div>
<div class="cta"><span class="btn">Apply as an organizer</span><a>How it works</a></div>
</div>
<div class="field"><div class="dots"></div><div class="lit"><i></i></div><span class="cap">the signature that made all of these</span><span class="foot">Real run on the XRP Ledger mainnet, 20 Oct 2026. Each mark is one ticket.</span></div>
</div></body></html>
