# HubWorld on Fly.io.
#
# The Dockerfile stays host-agnostic on purpose, so everything Fly-specific
# lives here and nothing in the image knows it is running on Fly.
#
# One process serves both the app and the API from one origin. That is a
# requirement, not a layout choice: the frontend calls a relative `/api`, opens
# its socket with a bare `io()`, and authenticates with a `SameSite=Lax` cookie
# that a browser stops sending on XHR the moment the API is a different site.
# So there is ONE service here, and there must never be two.

app = 'hubworld'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  # Non-secret configuration only. Anything sensitive goes through
  # `fly secrets set`, which is encrypted at rest and never committed.
  PORT = '4000'

  # Must match the public origin exactly. With one origin the `cors` middleware
  # is effectively inert, but a wrong value here is the kind of thing that only
  # shows up as a mystery 403 later.
  CORS_ORIGIN = 'https://hubworld.app'

  # Explicit rather than relying on the schema default. Minting on mainnet costs
  # real XRP and cannot be undone, so the network a deploy talks to should be
  # stated out loud in config, not inherited silently.
  XRPL_NETWORK = 'testnet'

[http_service]
  internal_port = 4000
  force_https = true

  # A demo link that cold-starts is a demo link that looks broken. Keeping one
  # machine warm costs a little every month and removes the ~10s wake-up an
  # interviewer would otherwise hit on the first click.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    # NOTE: /api/health deliberately returns 200 even when Postgres is down, so
    # the UI can still render a status. That makes this a LIVENESS check only —
    # it proves the process is answering, not that the app works. Do not add a
    # database assertion here expecting Fly to catch DB outages; read the `db`
    # field from the response instead.
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
